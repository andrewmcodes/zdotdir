#!/bin/zsh
#
# antidote_plugins.conf - antidote plugins file
#

# Completions
mattmc3/ez-compinit
zsh-users/zsh-completions kind:fpath path:src
aloxaf/fzf-tab # Remove if you don't use fzf
#? Deferred: YSU only needs to exist by the first `preexec`, and zsh-defer runs its
#? queue at the first zle idle — i.e. before you can submit a command. `fpath+=` is
#? still emitted eagerly by antidote, so nothing completion-related moves.
MichaelAquilina/zsh-you-should-use kind:defer

# Completion styles
belak/zsh-utils path:completion/functions kind:autoload post:compstyle_zshzoo_setup

# Keybindings
belak/zsh-utils path:editor

# History — atuin owns Ctrl-R + Up, initialized in rc.d/zz-atuin.zsh (it's a binary, not a plugin).
# History options/setopts live in rc.d/01-hist.zsh.

# Prompt

# Utilities
zshzoo/macos conditional:is-macos
belak/zsh-utils path:utility
romkatv/zsh-bench kind:path
#? Deferred: `extract` is a one-off interactive command. Its `_extract` completion
#? lives on fpath (added eagerly), so `extract <TAB>` keeps working either way.
ohmyzsh/ohmyzsh path:plugins/extract kind:defer

# Other Fish-like features
#* Pinned, unlike everything else here: zdharma-continuum is a community fork of an
#* abandoned org, i.e. exactly the account-takeover profile where an unpinned
#* `antidote update` would execute new third-party code at the next shell start.
#? cf318e06 is the commit this machine has been running (upstream master has since
#? moved to 3d574ccf as of 2026-07-29); bumping it is now a deliberate, reviewable
#? edit. The SHA must be a literal, full 40 chars — `antidote bundle` reads this file
#? through a plain `<` redirect, so a $VAR is never expanded and antidote rejects it.
zdharma-continuum/fast-syntax-highlighting kind:defer pin:cf318e06a9b7c9f2219d78f41b46fa6e06011fd9 # Syntax highlighting
zsh-users/zsh-autosuggestions                         # Auto-suggestions
